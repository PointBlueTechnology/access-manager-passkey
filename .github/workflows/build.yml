# Unit tests and a type-check of the browser tests on every push and pull request.
#
# The class compiles against Access Manager's own jars, which are OpenText's and can't be published,
# so this builds with the ci profile: everything except the five classes that call Access Manager's
# API, which are only compiled and checked against a real Identity Server (docs/BUILDING.md). The
# browser tests need a test Identity Server too, so here they're only type-checked.
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 11 is what Access Manager 5.1.3 runs; 21 checks the class on a current runtime too
        java: ['11', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Unit tests
        run: mvn -B -P ci test

  browser-tests-typecheck:
    name: Browser tests type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npm run check
